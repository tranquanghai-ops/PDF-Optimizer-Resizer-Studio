<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Optimizer & Resizer Studio V5.6</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #f8fafc; }
        #app-frame { width: 100%; height: 100%; border: 0; display: block; }
        #loading {
            position: fixed; inset: 0; z-index: 10; display: flex; align-items: center;
            justify-content: center; flex-direction: column; gap: 12px; color: #334155;
            font: 600 14px/1.4 system-ui, sans-serif; background: #f8fafc;
        }
        .spinner { width: 34px; height: 34px; border: 4px solid #dbeafe; border-top-color: #2563eb; border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading"><span class="spinner"></span><span>Đang khởi động PDF Optimizer Studio V5.6...</span></div>
    <iframe id="app-frame" title="PDF Optimizer Studio" allow="fullscreen" allowfullscreen></iframe>
    <script>
        const frame = document.getElementById('app-frame');
        const loading = document.getElementById('loading');
        let appStarted = false;

        function showStartupError(message) {
            if (!loading || !loading.isConnected) return;
            loading.innerHTML = `
                <strong>Không thể khởi động ứng dụng.</strong>
                <span>${message}</span>
                <button id="retry-startup" type="button" style="margin-top:6px;padding:9px 16px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer">
                    Tải lại ứng dụng
                </button>
            `;
            document.getElementById('retry-startup')?.addEventListener('click', () => location.reload());
        }

        function startApp() {
            if (appStarted) return;
            try {
                const doc = frame.contentDocument;
                if (!doc || !doc.body) throw new Error('Nội dung ứng dụng chưa sẵn sàng.');
                appStarted = true;
                const script = doc.createElement('script');
                script.src = 'pdf-tools.js?v=5.6.0';
                script.dataset.pdfTools = 'v5.6.0';
                script.onload = () => loading?.remove();
                script.onerror = () => showStartupError('Không tải được bộ công cụ V5.6. Vui lòng thử tải lại.');
                doc.body.appendChild(script);
            } catch (error) {
                appStarted = false;
                showStartupError(error.message);
            }
        }

        // Gắn sự kiện trước rồi mới nạp iframe để không bỏ lỡ sự kiện load khi trình duyệt dùng cache.
        frame.addEventListener('load', startApp);
        frame.src = 'app-v53.html?v=5.6.0';

        // Không để màn hình xoay vô hạn nếu mạng hoặc bộ nhớ đệm gặp sự cố.
        setTimeout(() => {
            if (loading?.isConnected) {
                showStartupError('Quá trình tải mất quá nhiều thời gian.');
            }
        }, 120000);
    </script>
</body>
</html>
