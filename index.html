<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Optimizer & Resizer Studio V5.4</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #f8fafc; }
        #app-frame { width: 100%; height: 100%; border: 0; display: block; }
        #loading {
            position: fixed; inset: 0; z-index: 10; display: flex; align-items: center;
            justify-content: center; flex-direction: column; gap: 12px; color: #334155;
            font: 600 14px/1.4 system-ui, sans-serif; background: #f8fafc;
        }
        .spinner { width: 34px; height: 34px; border: 4px solid #dbeafe; border-top-color: #2563eb; border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading"><span class="spinner"></span><span>Đang khởi động PDF Optimizer Studio V5.4...</span></div>
    <iframe id="app-frame" src="app-v53.html" title="PDF Optimizer Studio" allow="fullscreen" allowfullscreen></iframe>
    <script>
        const frame = document.getElementById('app-frame');
        const loading = document.getElementById('loading');
        frame.addEventListener('load', () => {
            try {
                const doc = frame.contentDocument;
                const script = doc.createElement('script');
                script.src = 'pdf-tools.js?v=5.4';
                script.onload = () => loading.remove();
                script.onerror = () => {
                    loading.innerHTML = '<strong>Không tải được bộ công cụ V5.4.</strong><span>Vui lòng tải lại trang bằng Ctrl + F5.</span>';
                };
                doc.body.appendChild(script);
            } catch (error) {
                loading.innerHTML = '<strong>Không thể khởi động ứng dụng.</strong><span>' + error.message + '</span>';
            }
        });
    </script>
</body>
</html>
